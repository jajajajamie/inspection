  const h = { "Content-Type":"application/json", apikey:key, Authorization:`Bearer ${key}`, Prefer:"return=representation" };
  return {
    getAll: () => fetch(`${base}?select=*&order=id.asc`,{headers:h}).then(r=>r.json()),
    upsert: d  => fetch(base,{method:"POST",headers:{...h,Prefer:"resolution=merge-duplicates,return=representation"},body:JSON.stringify(d)}).then(r=>r.json()),
    patch:  (id,d) => fetch(`${base}?id=eq.${id}`,{method:"PATCH",headers:h,body:JSON.stringify(d)}).then(r=>r.json()),
  };
}



// ── Responsive hook ──────────────────────────────────────────
function useIsMobile() {
  const [mob, setMob] = useState(typeof window !== "undefined" ? window.innerWidth < 768 : false);
  useEffect(() => {
    const fn = () => setMob(window.innerWidth < 768);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return mob;
}

// ── App ──────────────────────────────────────────────────────
function App() {
  const isMobile = useIsMobile();
  const [tasks,       setTasks]     = useState([]);
  const [loading,     setLoading]   = useState(true);
  const [connected,   setConn]      = useState(false);
  const [fSport,      setFSport]    = useState("全部");
  const [fDept,       setFDept]     = useState("全部");
  const [fStatus,     setFStatus]   = useState("全部");
  const [fStaff,      setFStaff]    = useState("全部");
  const [editId,      setEditId]    = useState(null);
  const [editData,    setEditData]  = useState({});
  const [saving,      setSaving]    = useState(false);
  const [expanded,    setExpanded]  = useState(null);

  const sb = sbClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  useEffect(() => { load(); }, []);

  async function load() {
    setLoading(true);
    const seed = RAW.map((r,i) => ({ id:i+1, sport:r[0], dept:r[1], category:r[2], detail:r[3], status:"pending", responsible_person:"", notes:"", deadline:"" }));
    try {
      const data = await sb.getAll();
      if (Array.isArray(data) && data.length > 0) { setTasks(data); setConn(true); }
      else {
        const ins = await sb.upsert(seed.map(({id:_,...r})=>r));
        if (Array.isArray(ins)) { setTasks(ins); setConn(true); } else throw 0;
      }
    } catch { setTasks(seed); setConn(false); }
    setLoading(false);
  }

  const statusMap = { "待完成":"pending","已完成":"completed","已中止":"cancelled" };
  const filtered = tasks.filter(t =>
    (fSport  ==="全部" || t.sport===fSport) &&
    (fDept   ==="全部" || t.dept===fDept)   &&
    (fStatus ==="全部" || t.status===statusMap[fStatus]) &&
    (fStaff  ==="全部" || t.responsible_person===fStaff)
  );

  const stats = {
    total: tasks.length,
    pending:   tasks.filter(t=>t.status==="pending").length,
    completed: tasks.filter(t=>t.status==="completed").length,
    cancelled: tasks.filter(t=>t.status==="cancelled").length,
  };

  function startEdit(t) {
    setEditId(t.id);
    setEditData({ status:t.status, responsible_person:t.responsible_person||"", notes:t.notes||"", deadline:t.deadline||"" });
  }
  async function saveEdit(task) {
    setSaving(true);
    if (connected) await sb.patch(task.id, {...editData, updated_at: new Date().toISOString()});
    setTasks(prev => prev.map(t => t.id===task.id ? {...t,...editData} : t));
    setEditId(null); setSaving(false);
  }

  const inp = (val, onChange, extra={}) => (
    <input value={val} onChange={e=>onChange(e.target.value)} style={{...inputSt,...extra}} />
  );

  return (
    <div style={{ fontFamily:"'PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif", background:"#f1f5f9", minHeight:"100vh", color:"#1e293b" }}>

      {/* HEADER */}
      <div style={{ background:"#fff", borderBottom:"2px solid #e2e8f0", padding: isMobile?"12px 14px":"16px 24px" }}>
        <div style={{ maxWidth:1800, margin:"0 auto" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:10 }}>
            <div>
              <div style={{ fontSize:11, letterSpacing:3, color:"#94a3b8", marginBottom:3 }}>第六届亚洲沙滩运动会 · 主播机构二次考察跟进台账</div>
              <h1 style={{ margin:0, fontSize: isMobile?17:21, fontWeight:700, color:"#0f172a" }}>转播需求任务追踪</h1>
            </div>
            <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
              <div style={{ display:"flex", gap:6 }}>
                {[{l:"待完成",v:stats.pending,c:"#d97706",bg:"#fffbeb"},{l:"已完成",v:stats.completed,c:"#059669",bg:"#f0fdf4"},{l:"已中止",v:stats.cancelled,c:"#6b7280",bg:"#f9fafb"}].map(s=>(
                  <div key={s.l} style={{ background:s.bg, border:`1px solid ${s.c}40`, borderRadius:9, padding: isMobile?"5px 10px":"6px 14px", textAlign:"center" }}>
                    <div style={{ fontSize: isMobile?17:20, fontWeight:700, color:s.c, lineHeight:1.1 }}>{s.v}</div>
                    <div style={{ fontSize:11, color:s.c }}>{s.l}</div>
                  </div>
                ))}
              </div>


            </div>
          </div>


        </div>
      </div>

      {/* DEPT LEGEND */}
      <div style={{ background:"#fff", borderBottom:"1px solid #e2e8f0", padding: isMobile?"8px 14px":"8px 24px" }}>
        <div style={{ maxWidth:1800, margin:"0 auto", display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
          <span style={{ fontSize:12, color:"#94a3b8", marginRight:2 }}>部门色标</span>
          {Object.entries(DEPT_COLORS).map(([d,c])=>(
            <span key={d} style={{ background:c.bg, color:c.text, border:`1px solid ${c.border}`, borderRadius:20, padding:"2px 9px", fontSize:11, fontWeight:500 }}>{d}</span>
          ))}
        </div>
      </div>

      {/* FILTERS */}
      <div style={{ background:"#fff", borderBottom:"1px solid #e2e8f0", padding: isMobile?"10px 14px":"10px 24px" }}>
        <div style={{ maxWidth:1800, margin:"0 auto" }}>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
            <span style={{ fontSize:12, color:"#94a3b8" }}>筛选</span>
            <FSel label="赛种"  value={fSport}  onChange={setFSport}  opts={["全部",...SPORTS_LIST]} />
            <FSel label="部门"  value={fDept}   onChange={setFDept}   opts={["全部",...DEPTS_LIST]} />
            <FSel label="状态"  value={fStatus} onChange={setFStatus} opts={["全部","待完成","已完成","已中止"]} />
            <FSel label="负责人" value={fStaff} onChange={setFStaff}  opts={["全部",...STAFF]} />
            <span style={{ fontSize:12, color:"#94a3b8", marginLeft:"auto" }}>共 <b>{filtered.length}</b> 条</span>
          </div>
        </div>
      </div>

      {/* MAIN */}
      <div style={{ maxWidth:1800, margin:"0 auto", padding: isMobile?"12px 10px":"16px 24px" }}>
        {loading ? (
          <div style={{ textAlign:"center",padding:80,color:"#94a3b8" }}>加载中…</div>
        ) : isMobile ? (
          /* ── MOBILE CARDS ── */
          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {filtered.map(task=>{
              const sc   = STATUS_CFG[task.status]||STATUS_CFG.pending;
              const dpc  = dc(task.dept);
              const isE  = editId===task.id;
              const open = expanded===task.id;
              return (
                <div key={task.id} style={{ background:"#fff", borderRadius:12, border:"1px solid #e2e8f0", overflow:"hidden", boxShadow:"0 1px 3px #0001" }}>
                  <div style={{ padding:"12px 14px", cursor:"pointer" }} onClick={()=>{ setExpanded(open?null:task.id); if(!open) setEditId(null); }}>
                    <div style={{ display:"flex", justifyContent:"space-between", gap:10 }}>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:6 }}>
                          <span style={{ background:"#f1f5f9",color:"#334155",borderRadius:5,padding:"2px 8px",fontSize:12,fontWeight:600 }}>{task.sport}</span>
                          <span style={{ background:dpc.bg,color:dpc.text,border:`1px solid ${dpc.border}`,borderRadius:20,padding:"2px 8px",fontSize:12,fontWeight:500 }}>{task.dept}</span>
                          <span style={{ background:"#f8fafc",color:"#64748b",borderRadius:5,padding:"2px 7px",fontSize:11 }}>{task.category}</span>
                        </div>
                        <div style={{ fontSize:14,color:"#1e293b",lineHeight:1.55 }}>{task.detail}</div>
                      </div>
                      <div style={{ display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0 }}>
                        <span style={{ background:sc.bg,color:sc.color,border:`1px solid ${sc.border}`,borderRadius:20,padding:"2px 9px",fontSize:12,fontWeight:500,whiteSpace:"nowrap" }}>
                          <span style={{ display:"inline-block",width:5,height:5,borderRadius:"50%",background:sc.dot,marginRight:4,verticalAlign:"middle" }}/>
                          {sc.label}
                        </span>
                        {task.responsible_person && <span style={{ fontSize:12,color:"#64748b" }}>👤{task.responsible_person}</span>}
                        <span style={{ fontSize:13,color:"#cbd5e1" }}>{open?"▲":"▼"}</span>
                      </div>
                    </div>
                  </div>
                  {open && (
                    <div style={{ borderTop:"1px solid #f1f5f9",padding:"12px 14px",background:"#fafbfc" }}>
                      {isE ? (
                        <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
                          <FL label="状态">
                            <select value={editData.status} onChange={e=>setEditData(p=>({...p,status:e.target.value}))} style={{...selSt,width:"100%"}}>
                              <option value="pending">待完成</option><option value="completed">已完成</option><option value="cancelled">已中止</option>
                            </select>
                          </FL>
                          <FL label="负责人">
                            <select value={editData.responsible_person} onChange={e=>setEditData(p=>({...p,responsible_person:e.target.value}))} style={{...selSt,width:"100%"}}>
                              <option value="">未分配</option>{STAFF.map(s=><option key={s}>{s}</option>)}
                            </select>
                          </FL>
                          <FL label="截止日期">
                            <input type="date" value={editData.deadline} onChange={e=>setEditData(p=>({...p,deadline:e.target.value}))} style={{...inputSt,width:"100%",boxSizing:"border-box"}}/>
                          </FL>
                          <FL label="备注/跟进记录">
                            <textarea value={editData.notes} onChange={e=>setEditData(p=>({...p,notes:e.target.value}))}
                              placeholder="填写跟进记录…" rows={3} style={{...inputSt,width:"100%",resize:"vertical",boxSizing:"border-box"}}/>
                          </FL>
                          <div style={{ display:"flex",gap:8 }}>
                            <button onClick={()=>saveEdit(task)} disabled={saving} style={{ flex:1,background:"#3b82f6",color:"#fff",border:"none",borderRadius:8,padding:"11px",cursor:"pointer",fontSize:14,fontWeight:600 }}>{saving?"保存中…":"保存"}</button>
                            <button onClick={()=>setEditId(null)} style={{ flex:1,background:"#f1f5f9",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:8,padding:"11px",cursor:"pointer",fontSize:14 }}>取消</button>
                          </div>
                        </div>
                      ) : (
                        <div style={{ display:"flex",flexDirection:"column",gap:8 }}>
                          <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
                            <IC label="负责人" value={task.responsible_person||"—"} />
                            <IC label="截止日期" value={task.deadline||"—"} />
                          </div>
                          <IC label="备注/跟进记录" value={task.notes||"—"} />
                          <button onClick={()=>startEdit(task)} style={{ marginTop:4,background:"#eff6ff",color:"#3b82f6",border:"1px solid #bfdbfe",borderRadius:8,padding:"10px",cursor:"pointer",fontSize:14,fontWeight:500 }}>编辑此任务</button>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            {filtered.length===0 && <div style={{ textAlign:"center",padding:60,color:"#94a3b8" }}>暂无符合条件的任务</div>}
          </div>
        ) : (
          /* ── DESKTOP TABLE ── */
          <div style={{ background:"#fff", borderRadius:12, border:"1px solid #e2e8f0", overflow:"hidden", boxShadow:"0 1px 4px #0001" }}>
            <div style={{ overflowX:"auto" }}>
              <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                <thead>
                  <tr style={{ background:"#f8fafc", borderBottom:"2px solid #e2e8f0" }}>
                    {["赛种","协调部门","科目","具体内容","状态","负责人","截止日期","备注 / 跟进记录","操作"].map(h=>(
                      <th key={h} style={{ padding:"11px 14px",textAlign:"left",color:"#64748b",fontWeight:600,fontSize:12,whiteSpace:"nowrap" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((task,idx)=>{
                    const isE = editId===task.id;
                    const sc  = STATUS_CFG[task.status]||STATUS_CFG.pending;
                    const dpc = dc(task.dept);
                    return (
                      <tr key={task.id} style={{ borderBottom:"1px solid #f1f5f9", background:idx%2===0?"#fff":"#fafbfc", verticalAlign:"top" }}>
                        <td style={{ padding:"10px 14px",whiteSpace:"nowrap",fontWeight:500,color:"#334155" }}>{task.sport}</td>
                        <td style={{ padding:"10px 14px",whiteSpace:"nowrap" }}>
                          <span style={{ background:dpc.bg,color:dpc.text,border:`1px solid ${dpc.border}`,borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:500 }}>{task.dept}</span>
                        </td>
                        <td style={{ padding:"10px 14px",whiteSpace:"nowrap",color:"#64748b" }}>{task.category}</td>
                        <td style={{ padding:"10px 14px",color:"#334155",lineHeight:1.6,minWidth:260,maxWidth:420 }}>{task.detail}</td>
                        <td style={{ padding:"10px 14px",whiteSpace:"nowrap" }}>
                          {isE ? (
                            <select value={editData.status} onChange={e=>setEditData(p=>({...p,status:e.target.value}))} style={selSt}>
                              <option value="pending">待完成</option><option value="completed">已完成</option><option value="cancelled">已中止</option>
                            </select>
                          ) : (
                            <span style={{ background:sc.bg,color:sc.color,border:`1px solid ${sc.border}`,borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:500 }}>
                              <span style={{ display:"inline-block",width:6,height:6,borderRadius:"50%",background:sc.dot,marginRight:5,verticalAlign:"middle" }}/>
                              {sc.label}
                            </span>
                          )}
                        </td>
                        <td style={{ padding:"10px 14px",whiteSpace:"nowrap" }}>
                          {isE ? (
                            <select value={editData.responsible_person} onChange={e=>setEditData(p=>({...p,responsible_person:e.target.value}))} style={selSt}>
                              <option value="">未分配</option>{STAFF.map(s=><option key={s}>{s}</option>)}
                            </select>
                          ) : (
                            <span style={{ color:task.responsible_person?"#1e293b":"#cbd5e1" }}>{task.responsible_person||"—"}</span>
                          )}
                        </td>
                        <td style={{ padding:"10px 14px",whiteSpace:"nowrap" }}>
                          {isE ? (
                            <input type="date" value={editData.deadline} onChange={e=>setEditData(p=>({...p,deadline:e.target.value}))} style={{...inputSt,width:130}}/>
                          ) : (
                            <span style={{ color:task.deadline?"#d97706":"#cbd5e1" }}>{task.deadline||"—"}</span>
                          )}
                        </td>
                        <td style={{ padding:"10px 14px",minWidth:240,maxWidth:360 }}>
                          {isE ? (
                            <textarea value={editData.notes} onChange={e=>setEditData(p=>({...p,notes:e.target.value}))}
                              placeholder="填写跟进记录…" rows={2}
                              style={{...inputSt,width:"100%",resize:"vertical",boxSizing:"border-box",minWidth:200}}/>
                          ) : (
                            <span style={{ color:task.notes?"#334155":"#cbd5e1",lineHeight:1.5 }}>{task.notes||"—"}</span>
                          )}
                        </td>
                        <td style={{ padding:"10px 14px",whiteSpace:"nowrap" }}>
                          {isE ? (
                            <div style={{ display:"flex",gap:6 }}>
                              <button onClick={()=>saveEdit(task)} disabled={saving} style={{ background:"#3b82f6",color:"#fff",border:"none",borderRadius:6,padding:"5px 14px",cursor:"pointer",fontSize:12,fontWeight:600 }}>{saving?"…":"保存"}</button>
                              <button onClick={()=>setEditId(null)} style={{ background:"#f1f5f9",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:12 }}>取消</button>
                            </div>
                          ) : (
                            <button onClick={()=>startEdit(task)} style={{ background:"#f8fafc",color:"#3b82f6",border:"1px solid #bfdbfe",borderRadius:6,padding:"5px 13px",cursor:"pointer",fontSize:12 }}>编辑</button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
              {filtered.length===0 && <div style={{ textAlign:"center",padding:60,color:"#94a3b8" }}>暂无符合条件的任务</div>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function FSel({ label, value, onChange, opts }) {
  return (
    <div style={{ display:"flex",alignItems:"center",gap:5 }}>
      <span style={{ fontSize:12,color:"#94a3b8",whiteSpace:"nowrap" }}>{label}</span>
      <select value={value} onChange={e=>onChange(e.target.value)} style={selSt}>{opts.map(o=><option key={o}>{o}</option>)}</select>
    </div>
  );
}
function SmBtn({ onClick, children }) {
  return <button onClick={onClick} style={{ background:"#f1f5f9",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:7,padding:"6px 12px",cursor:"pointer",fontSize:12 }}>{children}</button>;
}
function FL({ label, children }) {
  return <div><div style={{ fontSize:11,color:"#94a3b8",marginBottom:4,fontWeight:600 }}>{label}</div>{children}</div>;
}
function IC({ label, value }) {
  return (
    <div style={{ background:"#fff",borderRadius:8,padding:"8px 10px",border:"1px solid #e2e8f0" }}>
      <div style={{ fontSize:11,color:"#94a3b8",marginBottom:2 }}>{label}</div>
      <div style={{ fontSize:13,color:value==="—"?"#cbd5e1":"#334155",lineHeight:1.5 }}>{value}</div>
    </div>
  );
}

const selSt   = { background:"#fff",border:"1px solid #e2e8f0",borderRadius:7,padding:"6px 10px",color:"#334155",fontSize:13,cursor:"pointer",outline:"none" };
const inputSt = { background:"#fff",border:"1px solid #e2e8f0",borderRadius:7,padding:"7px 10px",color:"#334155",fontSize:13,outline:"none" };
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
