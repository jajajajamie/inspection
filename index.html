function exportExcel(tasks){
  const rows=tasks.map(t=>({
    "赛种":t.sport,"协调部门":t.dept,"科目":t.category,"具体内容":t.detail,
    "状态":t.status==="pending"?"待完成":t.status==="completed"?"已完成":"已中止",
    "截止日期":t.deadline||"","设备进场时间":t.equipment_date||"","开始供电时间":t.power_date||"",
    "跟进记录·Jamie":t.jamie_notes||"","跟进记录·Lan":t.lan_notes||""
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"转播需求");
  // Set column widths
  ws["!cols"]=[{wch:12},{wch:16},{wch:12},{wch:40},{wch:8},{wch:12},{wch:12},{wch:12},{wch:25},{wch:25}];
  XLSX.writeFile(wb,"转播需求任务追踪.xlsx");
}

function sbApi(){
  const base=SB_URL+"/rest/v1/broadcast_tasks";
  const hd={"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,Prefer:"return=representation"};
  return{
    getAll:()=>fetch(base+"?select=*&order=id.asc",{headers:hd}).then(r=>r.json()),
    upsert:d=>fetch(base,{method:"POST",headers:{...hd,Prefer:"resolution=merge-duplicates,return=representation"},body:JSON.stringify(d)}).then(r=>r.json()),
    patch:(id,d)=>fetch(base+"?id=eq."+id,{method:"PATCH",headers:hd,body:JSON.stringify(d)}).then(r=>r.json())
  };
}

      H("span",{style:{fontSize:12,color:"#94a3b8",whiteSpace:"nowrap"}},label),
      H("select",{value:val,onChange:e=>setVal(e.target.value),style:selSt},
        opts.map(o=>H("option",{key:o},o))
      )
    );
  }

  const filters=H("div",{style:{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:mob?"10px 14px":"10px 24px"}},
    H("div",{style:{maxWidth:1800,margin:"0 auto"}},
      H("div",{style:{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}},
        H("span",{style:{fontSize:12,color:"#94a3b8"}},"筛选"),
        FSel("赛种",fSport,setFSport,["全部",...SPORTS]),
        FSel("部门",fDept,setFDept,["全部",...DEPTS]),
        FSel("状态",fStatus,setFStatus,["全部","待完成","已完成","已中止"]),
        H("span",{style:{fontSize:12,color:"#94a3b8",marginLeft:"auto"}},H("span",null,"共 "),H("b",null,filtered.length),H("span",null," 条"))
      )
    )
  );

  // ── Mobile cards ──
  function renderMobile(){
    if(!filtered.length)return[H("div",{key:"empty",style:{textAlign:"center",padding:60,color:"#94a3b8"}},"暂无符合条件的任务")];
    return filtered.map(task=>{
      const sc=STATUS_CFG[task.status]||STATUS_CFG.pending;
      const dpc=dc(task.dept);
      const isE=editId===task.id;
      const open=expanded===task.id;
      return H("div",{key:task.id,style:{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 1px 3px #0001"}},
        H("div",{style:{padding:"12px 14px",cursor:"pointer"},onClick:()=>{setExpanded(open?null:task.id);if(!open)setEditId(null);}},
          H("div",{style:{display:"flex",justifyContent:"space-between",gap:10}},
            H("div",{style:{flex:1,minWidth:0}},
              H("div",{style:{display:"flex",gap:5,flexWrap:"wrap",marginBottom:6}},
                H("span",{style:{background:"#f1f5f9",color:"#334155",borderRadius:5,padding:"2px 8px",fontSize:12,fontWeight:600}},task.sport),
                H("span",{style:{background:dpc.bg,color:dpc.text,border:"1px solid "+dpc.border,borderRadius:20,padding:"2px 8px",fontSize:12,fontWeight:500}},task.dept),
                H("span",{style:{background:"#f8fafc",color:"#64748b",borderRadius:5,padding:"2px 7px",fontSize:11}},task.category)
              ),
              H("div",{style:{fontSize:14,color:"#1e293b",lineHeight:1.55}},task.detail||H("span",{style:{color:"#cbd5e1"}},"（留白）"))
            ),
            H("div",{style:{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:5,flexShrink:0}},
              H("span",{style:{background:sc.bg,color:sc.color,border:"1px solid "+sc.border,borderRadius:20,padding:"2px 9px",fontSize:12,fontWeight:500,whiteSpace:"nowrap"}},
                H("span",{style:{display:"inline-block",width:5,height:5,borderRadius:"50%",background:sc.dot,marginRight:4,verticalAlign:"middle"}}),
                sc.label
              ),
              H("span",{style:{fontSize:13,color:"#cbd5e1"}},open?"▲":"▼")
            )
          )
        ),
        open&&H("div",{style:{borderTop:"1px solid #f1f5f9",padding:"12px 14px",background:"#fafbfc"}},
          isE
          ?H("div",{style:{display:"flex",flexDirection:"column",gap:10}},
              H("div",null,
                H("div",{style:{fontSize:11,color:"#94a3b8",marginBottom:4,fontWeight:600}},"状态"),
                H("select",{value:editData.status,onChange:e=>setEditData(p=>({...p,status:e.target.value})),style:{...selSt,width:"100%"}},
                  H("option",{value:"pending"},"待完成"),H("option",{value:"completed"},"已完成"),H("option",{value:"cancelled"},"已中止")
                )
              ),
              task.category==="其他"&&H("div",null,
                H("div",{style:{fontSize:11,color:"#94a3b8",marginBottom:4,fontWeight:600}},"协调部门"),
                H("select",{value:editData.dept,onChange:e=>setEditData(p=>({...p,dept:e.target.value})),style:{...selSt,width:"100%"}},
                  DEPTS.map(d=>H("option",{key:d},d))
                )
              ),
              H("div",null,
                H("div",{style:{fontSize:11,color:"#94a3b8",marginBottom:4,fontWeight:600}},"截止日期"),
                H("input",{type:"date",value:editData.deadline,onChange:e=>setEditData(p=>({...p,deadline:e.target.value})),style:{...inpSt,width:"100%",boxSizing:"border-box"}})
              ),
              H("div",null,
                H("div",{style:{fontSize:11,color:"#059669",marginBottom:4,fontWeight:600}},"设备进场时间"),
                H("input",{type:"date",value:editData.equipment_date,onChange:e=>setEditData(p=>({...p,equipment_date:e.target.value})),style:{...inpSt,width:"100%",boxSizing:"border-box"}})
              ),
              H("div",null,
                H("div",{style:{fontSize:11,color:"#7c3aed",marginBottom:4,fontWeight:600}},"开始供电时间"),
                H("input",{type:"date",value:editData.power_date,onChange:e=>setEditData(p=>({...p,power_date:e.target.value})),style:{...inpSt,width:"100%",boxSizing:"border-box"}})
              ),
              H("div",null,
                H("div",{style:{fontSize:12,color:"#3b82f6",marginBottom:4,fontWeight:600}},"跟进记录 · Jamie"),
                H("textarea",{value:editData.jamie_notes,onChange:e=>setEditData(p=>({...p,jamie_notes:e.target.value})),placeholder:"Jamie 填写…",rows:3,style:{...inpSt,width:"100%",resize:"vertical",boxSizing:"border-box"}})
              ),
              H("div",null,
                H("div",{style:{fontSize:12,color:"#7c3aed",marginBottom:4,fontWeight:600}},"跟进记录 · Lan"),
                H("textarea",{value:editData.lan_notes,onChange:e=>setEditData(p=>({...p,lan_notes:e.target.value})),placeholder:"Lan 填写…",rows:3,style:{...inpSt,width:"100%",resize:"vertical",boxSizing:"border-box"}})
              ),
              H("div",{style:{display:"flex",gap:8}},
                H("button",{onClick:()=>saveEdit(task),disabled:saving,style:{flex:1,background:"#3b82f6",color:"#fff",border:"none",borderRadius:8,padding:"11px",cursor:"pointer",fontSize:14,fontWeight:600}},saving?"保存中…":"保存"),
                H("button",{onClick:()=>setEditId(null),style:{flex:1,background:"#f1f5f9",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:8,padding:"11px",cursor:"pointer",fontSize:14}},"取消")
              )
            )
          :H("div",{style:{display:"flex",flexDirection:"column",gap:8}},
              H("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
                H("div",{style:{background:"#fff",borderRadius:8,padding:"8px 10px",border:"1px solid #bfdbfe"}},
                  H("div",{style:{fontSize:11,color:"#3b82f6",marginBottom:2,fontWeight:600}},"Jamie"),
                  H("div",{style:{fontSize:13,color:task.jamie_notes?"#334155":"#cbd5e1",lineHeight:1.5}},task.jamie_notes||"—")
                ),
                H("div",{style:{background:"#fff",borderRadius:8,padding:"8px 10px",border:"1px solid #c4b5fd"}},
                  H("div",{style:{fontSize:11,color:"#7c3aed",marginBottom:2,fontWeight:600}},"Lan"),
                  H("div",{style:{fontSize:13,color:task.lan_notes?"#334155":"#cbd5e1",lineHeight:1.5}},task.lan_notes||"—")
                )
              ),
              H("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}},
                H("div",{style:{background:"#fff",borderRadius:8,padding:"8px 10px",border:"1px solid #e2e8f0"}},
                  H("div",{style:{fontSize:11,color:"#94a3b8",marginBottom:2}},"截止日期"),
                  H("div",{style:{fontSize:13,color:task.deadline?"#d97706":"#cbd5e1"}},task.deadline||"—")
                ),
                H("div",{style:{background:"#fff",borderRadius:8,padding:"8px 10px",border:"1px solid #d1fae5"}},
                  H("div",{style:{fontSize:11,color:"#059669",marginBottom:2}},"设备进场"),
                  H("div",{style:{fontSize:13,color:task.equipment_date?"#059669":"#cbd5e1"}},task.equipment_date||"—")
                )
              ),
              H("div",{style:{background:"#fff",borderRadius:8,padding:"8px 10px",border:"1px solid #ede9fe"}},
                H("div",{style:{fontSize:11,color:"#7c3aed",marginBottom:2}},"开始供电"),
                H("div",{style:{fontSize:13,color:task.power_date?"#7c3aed":"#cbd5e1"}},task.power_date||"—")
              ),
              H("button",{onClick:()=>startEdit(task),style:{marginTop:4,background:"#eff6ff",color:"#3b82f6",border:"1px solid #bfdbfe",borderRadius:8,padding:"10px",cursor:"pointer",fontSize:14,fontWeight:500}},"编辑此任务")
            )
        )
      );
    });
  }

  // ── Desktop table ──
  function renderDesktop(){
    return H("div",{style:{background:"#fff",borderRadius:12,border:"1px solid #e2e8f0",overflow:"hidden",boxShadow:"0 1px 4px #0001"}},
      H("div",{style:{overflowX:"auto"}},
        H("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:13}},
          H("thead",null,
            H("tr",{style:{background:"#f8fafc",borderBottom:"2px solid #e2e8f0"}},
              ["赛种","协调部门","科目","具体内容","状态","截止日期","设备进场","开始供电","跟进记录 · Jamie","跟进记录 · Lan","操作"].map((h,i)=>
                H("th",{key:h,style:{padding:"11px 14px",textAlign:"left",color:i===8?"#3b82f6":i===9?"#7c3aed":"#64748b",fontWeight:600,fontSize:12,whiteSpace:"nowrap"}},h)
              )
            )
          ),
          H("tbody",null,
            filtered.length===0
            ?H("tr",null,H("td",{colSpan:11,style:{textAlign:"center",padding:60,color:"#94a3b8"}},"暂无符合条件的任务"))
            :filtered.map((task,idx)=>{
              const isE=editId===task.id;
              const sc=STATUS_CFG[task.status]||STATUS_CFG.pending;
              const dpc=dc(task.dept);
              const isOther=task.category==="其他";
              return H("tr",{key:task.id,style:{borderBottom:"1px solid #f1f5f9",borderTop:task.dept==="主播机构"&&task.category==="设备进场时间"?"3px solid #eab308":"none",background:task.dept==="主播机构"?"#fef9c3":isOther?"#fffbeb":idx%2===0?"#fff":"#fafbfc",verticalAlign:"top"}},
                H("td",{style:{padding:"10px 14px",whiteSpace:"nowrap",fontWeight:500,color:"#334155"}},task.sport),
                H("td",{style:{padding:"10px 14px",whiteSpace:"nowrap"}},
                  isE&&isOther
                  ?H("select",{value:editData.dept,onChange:e=>setEditData(p=>({...p,dept:e.target.value})),style:selSt},
                      DEPTS.map(d=>H("option",{key:d},d))
                    )
                  :H("span",{style:{background:dpc.bg,color:dpc.text,border:"1px solid "+dpc.border,borderRadius:20,padding:"2px 10px",fontSize:12,fontWeight:500}},task.dept)
                ),
                H("td",{style:{padding:"10px 14px",whiteSpace:"nowrap",color:isOther?"#d97706":"#64748b",fontWeight:isOther?600:400}},task.category),
                H("td",{style:{padding:"10px 14px",color:"#334155",lineHeight:1.6,minWidth:200,maxWidth:380}},
                  isE&&task.dept==="主播机构"
                  ?H("input",{type:"date",value:editData.detail||"",onChange:e=>setEditData(p=>({...p,detail:e.target.value})),style:{...inpSt,width:160,boxSizing:"border-box"}})
                  :isE&&isOther
                  ?H("input",{value:editData.detail||"",onChange:e=>setEditData(p=>({...p,detail:e.target.value})),placeholder:"填写其他内容…",style:{...inpSt,width:"100%",boxSizing:"border-box"}})
                  :task.detail||H("span",{style:{color:"#cbd5e1"}},"—")
                ),
                H("td",{style:{padding:"10px 14px",whiteSpace:"nowrap"}},
                  isE
                  ?H("select",{value:editData.status,onChange:e=>setEditData(p=>({...p,status:e.target.value})),style:selSt},
                      H("option",{value:"pending"},"待完成"),H("option",{value:"completed"},"已完成"),H("option",{value:"cancelled"},"已中止")
                    )
                  :H("span",{style:{background:sc.bg,color:sc.color,border:"1px solid "+sc.border,borderRadius:20,padding:"3px 10px",fontSize:12,fontWeight:500}},
                      H("span",{style:{display:"inline-block",width:6,height:6,borderRadius:"50%",background:sc.dot,marginRight:5,verticalAlign:"middle"}}),
                      sc.label
                    )
                ),
                H("td",{style:{padding:"10px 14px",whiteSpace:"nowrap"}},
                  isE
                  ?H("input",{type:"date",value:editData.deadline,onChange:e=>setEditData(p=>({...p,deadline:e.target.value})),style:{...inpSt,width:130}})
                  :H("span",{style:{color:task.deadline?"#d97706":"#cbd5e1"}},task.deadline||"—")
                ),
                H("td",{style:{padding:"10px 14px",whiteSpace:"nowrap"}},
                  isE
                  ?H("input",{type:"date",value:editData.equipment_date,onChange:e=>setEditData(p=>({...p,equipment_date:e.target.value})),style:{...inpSt,width:130}})
                  :H("span",{style:{color:task.equipment_date?"#059669":"#cbd5e1"}},task.equipment_date||"—")
                ),
                H("td",{style:{padding:"10px 14px",whiteSpace:"nowrap"}},
                  isE
                  ?H("input",{type:"date",value:editData.power_date,onChange:e=>setEditData(p=>({...p,power_date:e.target.value})),style:{...inpSt,width:130}})
                  :H("span",{style:{color:task.power_date?"#7c3aed":"#cbd5e1"}},task.power_date||"—")
                ),
                H("td",{style:{padding:"10px 14px",minWidth:180,maxWidth:300,borderLeft:"2px solid #dbeafe"}},
                  isE
                  ?H("textarea",{value:editData.jamie_notes,onChange:e=>setEditData(p=>({...p,jamie_notes:e.target.value})),placeholder:"Jamie 填写…",rows:2,style:{...inpSt,width:"100%",resize:"vertical",boxSizing:"border-box",minWidth:160}})
                  :H("span",{style:{color:task.jamie_notes?"#334155":"#cbd5e1",lineHeight:1.5}},task.jamie_notes||"—")
                ),
                H("td",{style:{padding:"10px 14px",minWidth:180,maxWidth:300,borderLeft:"2px solid #ede9fe"}},
                  isE
                  ?H("textarea",{value:editData.lan_notes,onChange:e=>setEditData(p=>({...p,lan_notes:e.target.value})),placeholder:"Lan 填写…",rows:2,style:{...inpSt,width:"100%",resize:"vertical",boxSizing:"border-box",minWidth:160}})
                  :H("span",{style:{color:task.lan_notes?"#334155":"#cbd5e1",lineHeight:1.5}},task.lan_notes||"—")
                ),
                H("td",{style:{padding:"10px 14px",whiteSpace:"nowrap"}},
                  isE
                  ?H("div",{style:{display:"flex",gap:6}},
                      H("button",{onClick:()=>saveEdit(task),disabled:saving,style:{background:"#3b82f6",color:"#fff",border:"none",borderRadius:6,padding:"5px 14px",cursor:"pointer",fontSize:12,fontWeight:600}},saving?"…":"保存"),
                      H("button",{onClick:()=>setEditId(null),style:{background:"#f1f5f9",color:"#64748b",border:"1px solid #e2e8f0",borderRadius:6,padding:"5px 10px",cursor:"pointer",fontSize:12}},"取消")
                    )
                  :H("button",{onClick:()=>startEdit(task),style:{background:"#f8fafc",color:"#3b82f6",border:"1px solid #bfdbfe",borderRadius:6,padding:"5px 13px",cursor:"pointer",fontSize:12}},"编辑")
                )
              );
            })
          )
        )
      )
    );
  }

  return H("div",{style:{background:"#f1f5f9",minHeight:"100vh"}},
    header, legend, filters,
    H("div",{style:{maxWidth:1800,margin:"0 auto",padding:mob?"12px 10px":"16px 24px"}},
      loading
      ?H("div",{style:{textAlign:"center",padding:80,color:"#94a3b8"}},"加载中…")
      :mob
      ?H("div",{style:{display:"flex",flexDirection:"column",gap:10}},renderMobile())
      :renderDesktop()
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(H(App,null));
</script>
</body>
</html>
